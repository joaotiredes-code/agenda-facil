{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if editando else 'Novo' }} serviço{% endblock %}
{% block conteudo %}
<h1>{{ 'Editar serviço' if editando else 'Novo serviço' }}</h1>
<section class="cartao">
<form method="post" novalidate>
  <div class="campo">
    <label for="nome">Nome do serviço *</label>
    <input type="text" id="nome" name="nome" value="{{ servico.nome or '' }}" required minlength="3" autofocus>
  </div>
  <div class="campo">
    <label for="descricao">Descrição</label>
    <textarea id="descricao" name="descricao" rows="3">{{ servico.descricao or '' }}</textarea>
  </div>
  <div class="linha">
    <div class="campo">
      <label for="duracao_min">Duração (minutos) *</label>
      <input type="number" id="duracao_min" name="duracao_min" min="5" max="480" step="5" value="{{ servico.duracao_min or '' }}" required>
    </div>
    <div class="campo">
      <label for="preco">Preço (R$) *</label>
      <input type="text" inputmode="decimal" id="preco" name="preco" value="{{ servico.preco if servico.preco is not none else '' }}" required placeholder="45,00">
    </div>
  </div>
  <div class="campo campo-check">
    <input type="checkbox" id="ativo" name="ativo" value="1" {{ 'checked' if servico.ativo else '' }}>
    <label for="ativo">Serviço ativo (disponível para agendamento)</label>
  </div>
  <div class="botoes">
    <button type="submit" class="botao">Salvar</button>
    <a class="botao botao-secundario" href="{{ url_for('servicos.lista') }}">Cancelar</a>
  </div>
</form>
</section>
{% endblock %}
